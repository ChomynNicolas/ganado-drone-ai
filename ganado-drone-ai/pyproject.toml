# Configuracion de herramientas. El empaquetado Python se definira
# cuando exista un modulo instalable de la aplicacion.
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
